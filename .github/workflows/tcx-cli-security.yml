name: IntentProof — Security Checks

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tcx-cli-security.yml"
      - "config/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - ".env.example"
      - ".npmrc"
      - "eslint.config.js"
      - "index.html"
      - "package-lock.json"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
  pull_request:
    paths:
      - ".github/workflows/tcx-cli-security.yml"
      - "config/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - ".env.example"
      - ".npmrc"
      - "eslint.config.js"
      - "index.html"
      - "package-lock.json"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Ensure lockfile exists
        run: test -f package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run high severity audit gate
        run: npm run audit:high

      - name: Secret scan
        run: npm run secrets:check

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config: |
            paths:
              - src

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          # This public demo repository may not have GitHub code scanning
          # enabled. Run CodeQL queries and keep SARIF as an artifact instead
          # of failing CI while trying to upload to disabled code scanning.
          upload: never
          output: codeql-results

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-javascript-typescript-sarif
          path: codeql-results
          if-no-files-found: error

name: IntentProof — Quality Checks

on:
  pull_request:
    paths:
      - ".github/workflows/tcx-cli-ci.yml"
      - "config/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - ".env.example"
      - ".npmrc"
      - "eslint.config.js"
      - "index.html"
      - "package-lock.json"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tcx-cli-ci.yml"
      - "config/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - ".env.example"
      - ".npmrc"
      - "eslint.config.js"
      - "index.html"
      - "package-lock.json"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: CLI integration tests
        run: npm run test:cli

      - name: Chain compatibility smoke tests
        run: npm run test:smoke:chains

      - name: UI tests
        run: npm run test:ui

      - name: Secret scan
        run: npm run secrets:check

      - name: UI build
        run: npm run build:ui
